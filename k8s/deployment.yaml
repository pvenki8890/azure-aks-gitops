apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-web-app
  namespace: azure-web
  labels:
    app: azure-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-web-app
  template:
    metadata:
      labels:
        app: azure-web-app
    spec:
      containers:
        - name: azure-web-app
          image: pvgitopsacr2026.azurecr.io/azure-web-app:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
